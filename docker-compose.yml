version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: candidate-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Dreamlover#02
      MYSQL_DATABASE: candidatedb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pDreamlover#02"]
      interval: 10s
      timeout: 5s
      retries: 5

  candidate-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: candidate-app
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/candidatedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Dreamlover#02
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  mysql_data: